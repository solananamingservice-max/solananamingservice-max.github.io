<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tesla sign-in complete</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #16181d;
      --muted: #5c6570;
      --border: #d5dbe3;
      --accent: #111111;
      --accent-text: #ffffff;
      --danger: #8f1d1d;
      --danger-bg: #fdecec;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101216;
        --card: #1b1f27;
        --text: #f3f5f8;
        --muted: #aeb6c2;
        --border: #323844;
        --accent: #f3f5f8;
        --accent-text: #111111;
        --danger: #ffb4b4;
        --danger-bg: #3a1f1f;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    main {
      max-width: 36rem;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }

    h1 {
      font-size: 1.5rem;
      line-height: 1.25;
      font-weight: 650;
      margin: 0 0 1rem;
    }

    p { margin: 0 0 1rem; }

    .code {
      display: block;
      width: 100%;
      margin: 0 0 1rem;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1.35rem;
      line-height: 1.4;
      word-break: break-all;
      white-space: pre-wrap;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-text);
      font: inherit;
      font-weight: 650;
      min-height: 48px;
      padding: 0.75rem 1rem;
      width: 100%;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    button:active { opacity: 0.85; }

    .note { color: var(--muted); }

    .error {
      padding: 1rem;
      border-radius: 12px;
      background: var(--danger-bg);
      color: var(--danger);
    }

    .error p:last-child { margin-bottom: 0; }

    .status {
      min-height: 1.5rem;
      margin-top: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Tesla sign-in complete</h1>
    <div id="content"></div>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get("code");
      var state = params.get("state");
      var error = params.get("error");
      var errorDescription = params.get("error_description");
      var content = document.getElementById("content");

      function addText(parent, value) {
        parent.appendChild(document.createTextNode(value == null ? "" : String(value)));
      }

      function addState(parent) {
        if (!state) return;
        var line = document.createElement("p");
        line.className = "note";
        addText(line, "State: " + state);
        parent.appendChild(line);
      }

      if (code) {
        var box = document.createElement("div");
        box.className = "code";
        box.id = "auth-code";
        addText(box, code);

        var button = document.createElement("button");
        button.type = "button";
        button.textContent = "Copy code";

        var status = document.createElement("p");
        status.className = "status";
        status.setAttribute("role", "status");

        button.addEventListener("click", function () {
          navigator.clipboard.writeText(code).then(function () {
            status.textContent = "Copied";
          }).catch(function () {
            status.textContent = "Select the code above and copy it.";
          });
        });

        var note = document.createElement("p");
        note.className = "note";
        addText(note, "Copy this code and paste it back to your assistant. It expires in a few minutes.");

        content.appendChild(box);
        content.appendChild(button);
        content.appendChild(note);
        content.appendChild(status);
        addState(content);
        return;
      }

      if (error) {
        var err = document.createElement("div");
        err.className = "error";
        var errorLine = document.createElement("p");
        addText(errorLine, error);
        err.appendChild(errorLine);
        if (errorDescription) {
          var description = document.createElement("p");
          addText(description, errorDescription);
          err.appendChild(description);
        }
        content.appendChild(err);
        addState(content);
        return;
      }

      var empty = document.createElement("p");
      addText(empty, "No sign-in code found.");
      content.appendChild(empty);
      addState(content);
    })();
  </script>
</body>
</html>
